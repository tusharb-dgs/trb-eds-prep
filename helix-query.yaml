version: 1

indices:
  site-index:
    include:
      - '/**'                 # Matches everything from the root folder down to the deepest subfolder
    exclude:
      - '/**.json'            # Excludes data files/spreadsheets from being indexed
      - '/nav'                # Optional: Excludes global navigation documents
      - '/footer'             # Optional: Excludes global footer documents
    
    target: /query-index.json

    properties:
      path:
        select: none
        value: path
      
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
